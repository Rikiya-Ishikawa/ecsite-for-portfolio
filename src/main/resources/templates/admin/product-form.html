<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品登録・編集</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1 th:text="${product.id == null ? '商品登録' : '商品編集'}"></h1>
<form th:action="@{/admin/products/save}" th:object="${product}" method="post">
    <input type="hidden" th:field="*{id}">

    <label>商品名:</label>
    <input type="text" th:field="*{name}" required>
    <br>

    <label>説明:</label>
    <textarea th:field="*{description}" required></textarea>
    <br>

    <label>価格:</label>
    <input type="number" th:field="*{price}" required>
    <br>

    <label>在庫数:</label>
    <input type="number" th:field="*{stock}" required>
    <br>

    <button type="submit">保存</button>
    <a href="/admin/products">戻る</a>
</form>
</body>
</html>
